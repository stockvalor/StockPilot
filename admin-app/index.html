<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c2e"><link rel="manifest" href="manifest.webmanifest"><title>StockPilot Admin</title><style>body{background:#101c2e;color:white;font:16px system-ui;margin:0}main{max-width:480px;margin:40px auto;padding:20px}h1{color:#baff00}input,select,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:10px;font:inherit}input{background:#20324a;color:white;border:1px solid #718096}button{background:#baff00;color:#101c2e;border:0;font-weight:bold}.card{background:#1d2d42;padding:20px;border-radius:16px}#message{color:#ffbbbb}</style></head><body><main><h1>StockPilot Admin</h1><p>Espace administrateur privé</p><section id="login" class="card"><form id="form"><input id="email" type="email" placeholder="E-mail" autocomplete="username" required><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button>Se connecter</button></form></section><section id="dashboard" hidden><button id="logout">Déconnexion</button><div class="card"><h2>Entreprises</h2><div id="companies"></div></div><div class="card"><h2>Rechercher une entreprise</h2><form id="lookupForm"><input id="lookupEmail" type="email" placeholder="E-mail du client" required><button>Rechercher</button></form><div id="lookupResult" aria-live="polite"></div></div><div class="card"><h2>Licences</h2><p>Choisissez une durée de 1 à 15 jours pour le compte fictif de recette.</p><form id="pilotForm"><label for="pilotEmail">E-mail du compte test</label><input id="pilotEmail" type="email" autocomplete="off" required><label for="pilotDays">Durée (en jours)</label><input id="pilotDays" type="number" value="15" min="1" max="15" step="1" required><button>Générer une clé de test</button></form><p id="pilotStatus" role="status"></p><input id="pilotKey" aria-label="Clé de licence générée" hidden readonly></div></section><p id="message" role="alert"></p></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.95.0';const db=createClient('https://ieogcyuqgqmaebjkvlns.supabase.co',"sb_publishable_XQnwV3tYH4WDwCQ6GIALQw_jzF82UzT",{auth:{storageKey:"stockpilot-admin-session"}});const el=id=>document.getElementById(id);async function refresh(){const {data:{session}}=await db.auth.getSession();if(!session){el('login').hidden=false;el('dashboard').hidden=true;return}const {data,error}=await db.functions.invoke('stockpilot-admin-read',{body:{action:'companies'}});if(error||!Array.isArray(data?.companies)){
 const status=error?.context?.status;
 el('dashboard').hidden=true;
 el('login').hidden=false;
 el('message').textContent=status===403?'Ce compte ne dispose pas des droits administrateur.':status===401?'Session administrateur invalide. Reconnectez-vous.':'Le service administrateur est momentanément inaccessible.';
 if(status===401||status===403)await db.auth.signOut({scope:'local'});
 return;
}el('login').hidden=true;el('dashboard').hidden=false;el('message').textContent='';el('companies').replaceChildren(...data.companies.map(c=>{const p=document.createElement('p');p.textContent=c.name;return p}))}el('form').onsubmit=async e=>{e.preventDefault();el('message').textContent='Connexion…';const {error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('password').value='';if(error){el('message').textContent=error.code==='invalid_credentials'?'Identifiants administrateur incorrects. Vérifiez le compte et le mot de passe.':'Connexion impossible pour le moment.';return}await refresh()};el('lookupForm').onsubmit=async e=>{e.preventDefault();const email=el('lookupEmail').value.trim();el('lookupResult').textContent='Recherche en cours…';const {data,error}=await db.functions.invoke('stockpilot-admin-read',{body:{action:'lookup',email}});if(error||data?.error){el('lookupResult').textContent='Recherche impossible pour le moment.';return}el('lookupResult').textContent=data?.companies?.length?data.companies.map(x=>x.name).join(', '):'Aucune entreprise trouvée.'};el('pilotForm').onsubmit=async event=>{
 event.preventDefault();
 const button=event.currentTarget.querySelector('button');
 const status=el('pilotStatus'), key=el('pilotKey');
 button.disabled=true;
 key.value='';
 key.hidden=true;
 status.textContent='Génération en cours…';
 try{
  const {data:{session}}=await db.auth.getSession();
  if(!session){status.textContent='Reconnectez-vous à StockPilot Admin.';return}
  const response=await fetch('https://qofvnaomefqkemtxhmoi.supabase.co/functions/v1/stockpilot-pilot-license-issuer',{
   method:'POST',
   headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},
   body:JSON.stringify({email:el('pilotEmail').value.trim(),durationDays:el('pilotDays').valueAsNumber})
  });
  const result=await response.json();
  if(!response.ok){
   status.textContent=({
    INVALID_DURATION:'Choisissez une durée entière de 1 à 15 jours.',
    SIGNING_KEY_REQUIRED:'La clé de signature doit être configurée côté serveur.',
    WRONG_SIGNING_KEY:'La clé de signature du serveur ne correspond pas à StockPilot AI.',
    TEST_ACCOUNT_UNAVAILABLE:'Ce compte ne correspond pas au compte test 02.',
    ADMIN_REQUIRED:'Session administrateur requise. Reconnectez-vous.'
   })[result.error]||'Génération indisponible pour le moment.';
   return;
  }
  key.value=result.token;
  key.hidden=false;
  key.select();
  status.textContent='Clé créée. Expiration le '+new Date(result.expiresAt).toLocaleDateString('fr-FR')+'.';
 }catch{status.textContent='Connexion au service de licences impossible.'}
 finally{button.disabled=false}
};
el('logout').onclick=async()=>{await db.auth.signOut({scope:'local'});el('message').textContent='';el('pilotKey').value='';el('pilotKey').hidden=true;el('pilotStatus').textContent='';refresh()};refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
