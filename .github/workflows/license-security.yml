name: StockPilot license security tests
on:
  push:
    paths:
      - 'licensing/tests/**'
      - '.github/workflows/license-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  license-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run licensing regression tests
        run: node --test licensing/tests/*.test.mjs
