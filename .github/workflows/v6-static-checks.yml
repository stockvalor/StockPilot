name: StockPilot V6 static checks
on:
  push:
    branches: [fix/account-isolated-inventory]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript and security guards
        run: node tests/check-v6-static.cjs
      - name: Test stock quantity conflict handling
        run: node tests/check-v6-behavior.cjs
      - name: Test cloud product creation responses
        run: node tests/check-v6-product-behavior.cjs
      - name: Test receipt duplicate and malformed responses
        run: node tests/check-v6-receipt-behavior.cjs
      - name: Check proposed multi-company SQL safety structure
        run: node tests/check-v3-sql-proposal.cjs
